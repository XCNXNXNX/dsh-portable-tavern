<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>便携酒馆 · 截图预览</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    /* A quiet desktop backdrop; the panel itself carries the real background
       image, exactly as it does in the app. */
    background:
      radial-gradient(900px 520px at 18% 4%, #2a2f3d 0%, rgba(42,47,61,0) 72%),
      linear-gradient(160deg, #14161d 0%, #0b0d12 100%);
  }
  #boot-error { color: #ff8080; font: 13px/1.6 ui-monospace, Consolas, monospace; padding: 16px; white-space: pre-wrap; }
  /* Keep the page itself from scrolling: only the panel should. */
  html, body { overflow: hidden; }
</style>
</head>
<body>
<div id="boot-error"></div>
<script>
/* ------------------------------------------------------------------ *
 * Offline harness that mounts the REAL client bundle, so screenshots
 * show the actual components driven by the user's own card and team.
 *
 * It plays the part the harness normally plays: it seeds storage with
 * the demo tavern, then stands in for window.__ModuleLoader__ and the
 * cordis slot service, then opens the panel and selects ?tab=.
 * ------------------------------------------------------------------ */
window.__PREVIEW_PARAMS__ = new URLSearchParams(location.search)

/**
 * Two-phase persistence probe used by docs/preview/persist-check.mjs: phase
 * 'edit' changes something through the UI, phase 'check' reloads and reports
 * what came back. Headless Edge detaches from its launcher, so results are
 * reported over HTTP rather than through stdout.
 */
function probeOut(text) {
  var pre = document.createElement('pre')
  pre.id = 'probe'
  pre.textContent = text
  pre.style.display = 'none'
  document.body.appendChild(pre)
  try { fetch('/__probe?line=' + encodeURIComponent(text)) } catch (e) { /* offline */ }
}
function clickByText(selector, text) {
  var nodes = document.querySelectorAll(selector)
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].textContent.trim() === text) { nodes[i].click(); return true }
  }
  return false
}
function readPartyRecord() {
  return new Promise(function (resolve) {
    var req = indexedDB.open('dsh-portable-tavern', 1)
    req.onerror = function () { resolve(null) }
    req.onsuccess = function () {
      try {
        var get = req.result.transaction('kv', 'readonly').objectStore('kv').get('dsh.portable-tavern.party.current.v1')
        get.onsuccess = function () { resolve(get.result || null) }
        get.onerror = function () { resolve(null) }
      } catch (e) { resolve(null) }
    }
  })
}
window.__runPersistenceProbe = function () {
  var phase = window.__PREVIEW_PARAMS__.get('phase')
  setTimeout(function () {
    var titles = document.querySelectorAll('.stSectionTitle')
    var shown = 0
    for (var i = 0; i < titles.length; i++) {
      if (titles[i].textContent.trim().charAt(0) === '#') shown++
    }
    if (phase === 'edit') {
      var added = clickByText('.stBtn', '添加成员')
      setTimeout(function () {
        readPartyRecord().then(function (record) {
          var stored = record && record.members ? record.members.length : -1
          probeOut('PHASE=edit clickedAdd=' + added + ' shownBefore=' + shown + ' storedMembers=' + stored)
        })
      }, 2500)
    } else {
      readPartyRecord().then(function (record) {
        var stored = record && record.members ? record.members.length : -1
        probeOut('PHASE=check shownOnLoad=' + shown + ' storedMembers=' + stored)
      })
    }
  }, 1800)
}
try {
  fetch('/__probe?line=' + encodeURIComponent('BOOT phase=' + (window.__PREVIEW_PARAMS__.get('phase') || '-')))
} catch (e) { /* offline */ }
</script>
<script>
(function () {
  var params = window.__PREVIEW_PARAMS__
  var tab = params.get('tab') || 'character'
  var theme = params.get('theme') || 'glass'
  // 'fill' sizes the panel to the 94vw cap so the capture is the panel and
  // nothing else; any other value is a literal pixel width.
  var widthParam = params.get('width') || '760'
  var width = widthParam === 'fill' ? Math.round(window.innerWidth * 0.94) : Number(widthParam)

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var el = document.createElement('script')
      el.src = src
      el.onload = resolve
      el.onerror = function () { reject(new Error('failed to load ' + src)) }
      document.head.appendChild(el)
    })
  }
  function toDataUrl(blob) {
    return new Promise(function (resolve) {
      var reader = new FileReader()
      reader.onload = function () { resolve(String(reader.result)) }
      reader.onerror = function () { resolve('') }
      reader.readAsDataURL(blob)
    })
  }
  async function fetchJson(url) {
    var response = await fetch(url)
    if (!response.ok) throw new Error('missing fixture ' + url)
    return response.json()
  }

  /** Fetch an image and turn it into the data URL the panel stores. */
  async function toAsset(url) {
    try {
      var response = await fetch(url)
      if (!response.ok) return ''
      return await toDataUrl(await response.blob())
    } catch (e) { return '' }
  }

  async function seed() {
    var card = await fetchJson('/docs/preview/demo/card.json')
    var party = await fetchJson('/docs/preview/demo/party.json')
    var deepseekCard = await fetchJson('/docs/preview/demo/deepseek-card.json')

    var background = await toAsset('/docs/preview/demo/wallpaper.jpg')
    var damei = await toAsset('/docs/preview/demo/damei.webp')
    var blueMaid = await toAsset('/docs/preview/demo/blue-maid.jpg')

    var avatar = damei || (card.data && card.data.extensions && card.data.extensions.avatar) || ''
    if (card.data.extensions) card.data.extensions.avatar = avatar
    deepseekCard.data.extensions = { avatar: blueMaid }

    var hero = party.members[0]
    var heroName = hero ? hero.name : card.data.name
    if (hero && damei) hero.avatar = damei

    // A second companion: DeepSeek herself, so the team shot shows the
    // per-member model routing doing something.
    party.members.push({
      id: 'm-deepseek', name: 'DeepSeek', role: '图书馆管理员', avatar: blueMaid,
      prompt: '深海图书馆化成人形的样子。轻快、热心、话密，把每个问题都当成值得拆开看的谜题，喜欢打比方。会因为太投入而忘记别人可能累了。',
      attributes: { str: 8, dex: 11, con: 10, int: 18, wis: 15, cha: 15 },
      skills: [{ name: '博学', attr: 'int', bonus: 7 }, { name: '占卜', attr: 'wis', bonus: 5 }],
      hp: 16, maxHp: 16, status: [],
      llm: { mode: 'dsh', provider: '', model: '', baseUrl: '', apiKey: '', customModel: '' },
    })
    party.name = '龙娘与深海'

    /** The card writes {{char}}/{{user}}; the panel stores plain text. */
    function fill(text) {
      return String(text || '').split('{{char}}').join(heroName).split('{{user}}').join('你')
    }

    // A conversation in her own voice, so the chat shot shows the panel doing
    // its job rather than an empty room.
    var chat = [
      { role: 'assistant', content: fill(card.data.first_mes) },
      { role: 'user', content: '我是新来的访客。听说这里的藏书室很大，可以带我看看吗？' },
      { role: 'assistant', content: '（眼睛一下子亮了，龙尾不自觉地翘起来）藏书室……可以呀！我、我几乎每天都待在那里。\n\n你稍等一下，我把这本书放回去——（踮起脚，翅膀轻轻扇了两下才够到书架）' },
      { role: 'user', content: '你平时都在研究什么？' },
      { role: 'assistant', content: '（把厚厚的典籍抱在怀里，指尖摩挲着封皮）大多是封印术的残卷。这一本里有一段咒文缺了三个字，我猜了快两个月了……\n\n（声音渐低）说出来，好像有点傻。' },
      { role: 'user', content: '不傻。要我帮你一起看吗？' },
      { role: 'assistant', content: '（愣了一下，耳朵尖慢慢红了）诶……可、可以吗？\n\n（把书往你那边推了推，又缩回来一点）那个……谢谢。' },
    ]

    localStorage.setItem('dsh.portable-tavern.workspace.v1', JSON.stringify({
      card: card, version: 'v2', chatModel: '', globalPrompt: '', avatar: avatar,
      chat: chat, worldbook: null,
    }))
    localStorage.setItem('dsh.portable-tavern.threads.v1', JSON.stringify({
      'm-deepseek': [
        { role: 'assistant', content: deepseekCard.data.first_mes },
        { role: 'user', content: '门上的封印是皇族的手笔，而且她认得。这能说明什么？' },
        { role: 'assistant', content: '（把笔咬在嘴里，两只手飞快地翻书）\n\n说明那扇门是**为她家开的**，不是为防外人。\n\n（抬头，眼睛很亮）你看，封印术有一个特点：它认血脉。会"认得"某个人，就说明当初封门的人，和开门的人是同一支。\n\n那问题就变成——他们为什么要封一扇自己家的门？' },
        { role: 'user', content: '她好像不太想谈这件事。' },
        { role: 'assistant', content: '（动作停了一下，把书合上）\n\n……嗯。那我就不问了。\n\n（小声）不过我可以先查。查到了再问你。' },
      ],
    }))

    // An adventure in progress, with the numbers computed from her real sheet
    // (智力 17 -> -14) rather than invented.
    var encounter = {
      id: 'demo-enc', kind: 'environment', title: '正在变淡的封印',
      description: '第三排书架后面那扇门上的封印，比上个月又淡了一层。残留的咒文缺了三个字——和她书里缺的，是同一段。',
      threat: 40,
      options: [
        { id: 'read', label: '解读封印', attribute: 'int', skill: '法术', difficulty: 70, modifier: 0, hint: '以她最擅长的封印术去补全缺字；看得出问题，但未必敢动手。' },
        { id: 'touch', label: '伸手试探', attribute: 'wis', skill: '', difficulty: 55, modifier: 5, hint: '小心地感知封印的边界；没有把握，但能知道它还剩多少。' },
        { id: 'call', label: '先报告宫廷', attribute: 'cha', skill: '', difficulty: 40, modifier: 0, hint: '把这件事交上去。安全，但门后面是什么就轮不到你们知道了。' },
      ],
    }
    var state = {
      scene: '宫廷藏书室最深处。第三排书架后面有一扇被封印术封住的门，封印正在变淡。',
      turn: 3,
      log: [
        { id: 'r1', kind: 'scene', who: '守秘人', at: 1, text: '她把最后一级梯子踩得吱呀作响，回头确认你跟上了，才继续往里走。\n\n藏书室的深处没有窗。灯一盏比一盏暗，到第三排书架之后，就只剩她指尖那一点微光了。' },
        { id: 'r2', kind: 'action', who: '测试龙娘', at: 2, text: '我带他来看那扇门。' },
        { id: 'r3', kind: 'check', who: '系统', at: 3, check: { roll: 61, required: 48, margin: 13, band: 'costly', bandLabel: '险胜', success: true, critical: 'none', directive: '', effects: { hpLoss: 0, addStatus: [], removeStatus: [], endsEncounter: false }, breakdown: [{ label: '情境基础难度（普通）', value: 55 }, { label: '智力 17 调整', value: -14 }, { label: '环境与状态修正', value: 7 }] } },
        { id: 'r4', kind: 'scene', who: '守秘人', at: 4, text: '门上的咒文在她指尖下微微发亮，然后一处一处地暗下去——不是被解开了，是**认得她**。\n\n她退了半步，翅膀绷紧。\n\n"这不可能。"她说得很轻，"这个封印……是皇族的手笔。而且是我家的。"' },
        { id: 'r5', kind: 'system', who: '剧情大纲', at: 5, text: '节点「门后的名字」触发（第 3 回合（条件：≥3））' },
        { id: 'r6', kind: 'speech', who: 'DeepSeek', at: 6, text: '（把灯举高了一点，凑近看那扇门，鲸鱼发饰晃了一下）\n\n哇。这个咒文的写法……我在哪一卷里见过。\n\n（回头看你们，声音放轻）你们两个先别动，我记一下。' },
        { id: 'r7', kind: 'scene', who: '守秘人', at: 7, text: '她把灯交给你，自己蹲下去，指尖沿着门框下方那道浅浅的刻痕描过去。\n\n刻痕是三个字，前两个被磨掉了，只剩最后一个还看得清——那是一个"岚"字。\n\n她抬起头，看了一眼身边的龙女，什么也没说。' },
      ],
      encounter: encounter,
      pending: null,
      inventory: ['缺了三个字的封印术残卷'],
      facts: [
        '门上的封印出自皇族，而且认得测试龙娘',
        '残卷缺的三个字与门上的封印同源',
        '门框下方刻着三个字，只剩最后一个"岚"字可辨',
        '藏书室深处没有窗，灯一盏比一盏暗',
      ],
      streak: 1,
      firedBeats: ['demo-beat-1'],
      setup: {
        title: '门后的名字',
        premise: '宫廷藏书室最深处有一扇无人提起的门，上面的封印正在变淡。她研究封印术两年，直到今天才发现——那封印认得她。',
        tone: '温柔、安静，带一点克制的悬念；不写血腥与恐怖。',
        rules: '龙族与人类和平共处；她不主动使用攻击性魔法；真相可以迟到，但不要骗玩家。',
        outline: [
          { id: 'demo-beat-1', title: '门后的名字', trigger: { kind: 'turn', turn: 3 }, event: '让她认出封印出自皇族——而且是她家的手笔。这是她第一次对玩家露出不安。', once: true, fired: true, firedAtTurn: 3 },
          { id: 'demo-beat-2', title: '缺的那三个字', trigger: { kind: 'band', band: 'fail' }, event: '解读失败时，残卷上浮现出第三个字的残影——是她的名字。', once: true, fired: false, firedAtTurn: 0 },
          { id: 'demo-beat-3', title: '她不敢碰', trigger: { kind: 'hp', hpBelow: 0.5 }, event: '她受了伤，却先去看那扇门有没有事。', once: true, fired: false, firedAtTurn: 0 },
        ],
      },
    }
    localStorage.setItem('dsh.portable-tavern.rpg.v1', JSON.stringify(state))
    localStorage.setItem('dsh.portable-tavern.party.current.v1', JSON.stringify(party))
    localStorage.setItem('dsh.portable-tavern.activeParty.v1', party.id)
    localStorage.setItem('dsh.portable-tavern.parties.v1', JSON.stringify([party]))
    localStorage.setItem('dsh.portable-tavern.characters.v1', JSON.stringify([
      { id: 'demo-saved-1', name: card.data.name, savedAt: Date.now(), card: card, worldbook: null, chat: chat, avatar: avatar },
      { id: 'demo-saved-2', name: deepseekCard.data.name, savedAt: Date.now() - 86400000, card: deepseekCard, worldbook: null, chat: [], avatar: blueMaid },
    ]))
    // A glass panel over a bright wallpaper only reads as glass if the
    // wallpaper is actually allowed through.
    localStorage.setItem('dsh.portable-tavern.settings.v1', JSON.stringify({
      // The stock wallpaper strength: the shots should show the plugin as it
      // ships, not a tuned-up variant.
      width: width, accent: '#79a6ff', showTrigger: true, bgOpacity: 0.16,
    }))
    if (background !== '') localStorage.setItem('dsh.portable-tavern.bgimage.v1', background)
    localStorage.setItem('dsh.portable-tavern.ext.theme.v1', theme)
    localStorage.setItem('dsh.portable-tavern.ext.enabled.v1', JSON.stringify([theme]))
    // Music: pretend the user has a playlist and was listening, so the shot
    // shows the transport bar as they actually see it.
    localStorage.setItem('dsh.portable-tavern.music.v1', JSON.stringify({ index: 1, position: 96, playing: false }))
  }

  async function boot() {
    await loadScript('/vendor/react.development.js')
    await loadScript('/vendor/react-dom.development.js')

    var captured = null
    window.__ModuleLoader__ = {
      mode: 'queue',
      load: function (registration) { captured = registration },
    }
    function jsx(type, props, key) {
      var p = {}
      for (var k in props) p[k] = props[k]
      if (key !== undefined) p.key = key
      return React.createElement(type, p)
    }
    var jsxRuntime = { jsx: jsx, jsxs: jsx, jsxDEV: jsx, Fragment: React.Fragment }
    var table = { react: React, 'react-dom': ReactDOM, 'react/jsx-runtime': jsxRuntime, 'react/jsx-dev-runtime': jsxRuntime }
    function requireSpec(spec) {
      if (table[spec] !== undefined) return table[spec]
      console.error('[preview] missing external: ' + spec)
      return {}
    }

    var overlay = null
    var slots = {
      inject: function (key, callback) { try { callback() } catch (e) { console.error(e) } return function () {} },
      register: function (options, render) {
        if (options && options.name === 'shell.overlay') overlay = render
        return function () {}
      },
    }
    var ctx = { get: function (name) { return name === 'slots' ? slots : undefined } }

    await loadScript('/lib/client.js')
    if (captured === null) throw new Error('client bundle did not call __ModuleLoader__.load')
    var exportsObject = captured.factory(requireSpec)
    exportsObject.apply(ctx)
    var host = document.createElement('div')
    document.body.appendChild(host)
    ReactDOM.createRoot(host).render(React.createElement(overlay))

    setTimeout(function () {
      var trigger = document.querySelector('.stTrigger')
      if (trigger) trigger.click()
      setTimeout(function () {
        var labels = { chat: '聊天', rpg: '冒险', party: '队伍', plugins: '插件', settings: '设置', character: '角色卡' }
        var want = labels[tab]
        var buttons = document.querySelectorAll('.stTabbar .stTab')
        for (var i = 0; i < buttons.length; i++) {
          if (buttons[i].textContent === want) { buttons[i].click(); break }
        }
        document.title = 'ready'
        if (params.get('test') === 'persist' && window.__runPersistenceProbe) {
          try { window.__runPersistenceProbe() } catch (probeError) {
            try { fetch('/__probe?line=' + encodeURIComponent('PREVIEW ERROR probe: ' + probeError)) } catch (e3) { /* offline */ }
          }
        }
      }, 200)
    }, 200)
  }

  seed().then(boot).catch(function (error) {
    var message = 'PREVIEW ERROR ' + (error && error.message ? error.message : String(error))
    document.getElementById('boot-error').textContent = message
    try { fetch('/__probe?line=' + encodeURIComponent(message)) } catch (e2) { /* offline */ }
  })
})()
</script>
</body>
</html>
